[project]
name = "globalpose"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
authors = [
    { name = "AlexBeattie42", email = "30098201+alexbeattie42@users.noreply.github.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch",
    "chumpy",
    "cython<3",
    "numpy<1.24",
    "vctoolkit",
    "open3d",
    "pybullet>=3.2.7",
    "qpsolvers[osqp,quadprog]>=4.13.0",
    "numpy-quaternion>=2023.0.4",
    "tensorboard>=2.21.0",
    "thop>=0.1.1.post2209072238",
]

[project.scripts]
globalpose = "globalpose:main"


[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
